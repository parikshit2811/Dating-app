databases:
  - name: vibematch-db
    plan: free
    databaseName: vibematch

services:
  - type: web
    name: vibe-match-dating
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vibematch-db
          property: connectionString
